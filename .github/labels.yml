# Labels used by docs automation.
# The Slack /ship-it app applies the base `ship-it` label to every ticket it
# creates, plus ONE variant depending on the workflow branch the user chose:
#   - ship-it-new-docs    → the workflow drafts a new page
#   - ship-it-doc-updates → the workflow edits existing page(s)
# The workflow (.github/workflows/ship-it.yml) triggers on either variant label;
# the base `ship-it` label is informational and not required to fire.

- name: ship-it
  color: "5319E7"
  description: "Created by the Slack /ship-it app (base label on every ship-it ticket)"

- name: ship-it-new-docs
  color: "1D76DB"
  description: "ship-it variant: draft a NEW documentation page"

- name: ship-it-doc-updates
  color: "0052CC"
  description: "ship-it variant: UPDATE existing documentation"

- name: ship-it-processed
  color: "0E8A16"
  description: "The ship-it workflow has already run for this issue"

- name: ship-it-failed
  color: "B60205"
  description: "The ship-it workflow errored; needs a human"
