name: ship-it docs

# Triggered by the Slack /ship-it app, which opens a GitHub issue and labels it.
# Every ship-it ticket carries the base `ship-it` label plus ONE variant that
# depends on the Slack workflow branch the user chose:
#   - ship-it-new-docs    → draft a NEW documentation page
#   - ship-it-doc-updates → EDIT the existing page(s) for the feature
# The issue body contains a Jira browse URL (for example
# https://snyksec.atlassian.net/browse/DOCT-2618). This workflow extracts the
# ticket key, runs Claude Code headlessly in the mode the variant selects, opens
# a draft PR against main, and comments the result on the issue.
#
# See .github/ship-it-README.md for the full contract and the required secrets.

on:
  issues:
    types: [opened, labeled]

# Never run two ship-it jobs for the same issue at once.
concurrency:
  group: ship-it-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write        # push the docs branch
  pull-requests: write   # open the draft PR
  issues: write          # comment + relabel the triggering issue

jobs:
  # ---------------------------------------------------------------------------
  # Gate: only proceed for ship-it issues that carry a parseable Jira key and
  # have not already been processed. Extracts the key for the next job.
  # ---------------------------------------------------------------------------
  gate:
    runs-on: ubuntu-latest
    # Fire on either variant label; the base `ship-it` label is not required.
    if: >-
      contains(github.event.issue.labels.*.name, 'ship-it-new-docs') ||
      contains(github.event.issue.labels.*.name, 'ship-it-doc-updates')
    outputs:
      ticket: ${{ steps.parse.outputs.ticket }}
      mode: ${{ steps.parse.outputs.mode }}
      proceed: ${{ steps.parse.outputs.proceed }}
    steps:
      - name: Extract Jira ticket key and mode from the issue
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          LABELS_JSON: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: |
          # Already handled? Bail out quietly.
          if echo "$LABELS_JSON" | grep -q 'ship-it-processed'; then
            echo "Issue already processed; skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Determine mode from the variant label. new-docs wins if somehow both
          # are present (creating a page is the safer default to review).
          if echo "$LABELS_JSON" | grep -q 'ship-it-new-docs'; then
            MODE="new"
          elif echo "$LABELS_JSON" | grep -q 'ship-it-doc-updates'; then
            MODE="update"
          else
            echo "No ship-it variant label present; skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Mode: $MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

          # Pull the first DOCT-#### (or other PROJECT-####) key out of the body.
          # Prefer a key on a "Jira issue:" line / browse URL, fall back to any key.
          TICKET="$(printf '%s' "$ISSUE_BODY" \
            | grep -oiE 'atlassian\.net/browse/[A-Z][A-Z0-9]+-[0-9]+' \
            | grep -oiE '[A-Z][A-Z0-9]+-[0-9]+' \
            | head -n1 || true)"

          if [ -z "$TICKET" ]; then
            TICKET="$(printf '%s' "$ISSUE_BODY" \
              | grep -oiE '\b[A-Z][A-Z0-9]+-[0-9]+\b' | head -n1 || true)"
          fi

          if [ -z "$TICKET" ]; then
            echo "No Jira ticket key found in issue body."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Normalize to upper case.
          TICKET="$(printf '%s' "$TICKET" | tr '[:lower:]' '[:upper:]')"
          echo "Found ticket: $TICKET"
          echo "ticket=$TICKET" >> "$GITHUB_OUTPUT"
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Comment when no ticket key is found
        if: steps.parse.outputs.proceed == 'false' && steps.parse.outputs.ticket == ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                "⚠️ **ship-it skipped.**",
                "",
                "No Jira ticket key found in this issue. Add a line like:",
                "`Jira issue: https://snyksec.atlassian.net/browse/DOCT-1234`",
                "then re-apply the **ship-it-new-docs** or **ship-it-doc-updates** label.",
              ].join("\n"),
            });

  # ---------------------------------------------------------------------------
  # Run: draft the docs with Claude Code and open a draft PR.
  # ---------------------------------------------------------------------------
  draft:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout user-docs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so placement/dedup logic can read main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs-agent Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            'requests>=2.31.0' \
            'python-dotenv>=1.0.0' \
            'markdownify>=0.11.0' \
            'google-auth>=2.23.0' \
            'google-auth-oauthlib>=1.1.0' \
            'google-auth-httplib2>=0.1.1' \
            'google-api-python-client>=2.100.0'

      - name: Mark the issue as in-progress
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "🚀 Running the ship-it docs workflow (${{ needs.gate.outputs.mode == 'update' && 'update existing docs' || 'new docs' }}) for **${{ needs.gate.outputs.ticket }}**…",
            });

      # --- NEW DOCS: draft a brand-new page via the ship-it-new-docs skill. -----
      - name: Draft new docs with Claude Code
        id: claude_new
        if: needs.gate.outputs.mode == 'new'
        uses: anthropics/claude-code-action@v1
        env:
          # Fetch-script credentials (read by the skill's Python scripts).
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          # Optional: a pre-seeded Google token for headless Google Docs fetches.
          # If absent, the skill skips Google Docs and notes it in the PR body.
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # A PAT (not the default GITHUB_TOKEN) so the PR can trigger the
          # docs-quality / link-checker / image-audit checks on itself.
          github_token: ${{ secrets.SHIP_IT_PAT }}
          prompt: |
            Run the /ship-it-new-docs skill for Jira ticket ${{ needs.gate.outputs.ticket }}.

            You are running headlessly in GitHub Actions — there is no human to
            answer prompts. Follow these non-interactive rules:
            - Do NOT run the interactive "sync local clone" checkpoint; the checkout
              is already current. Skip Step 0's questions.
            - Decide page placement yourself using the fixed section rules in the
              skill (never create a new top-level folder). State the chosen
              placement in the PR body so a Technical Writer can confirm it.
            - If a Google Docs URL is referenced but no Google token is configured,
              skip that source and note the omission in the PR body — do not fail.
            - Create the page and update the matching section SUMMARY.md.
            - Commit to a new branch named ship-it/${{ needs.gate.outputs.ticket }},
              push it, then run /create-draft-pr to open a DRAFT PR against main.
            - The PR title must start with "${{ needs.gate.outputs.ticket }}:".
            - In the PR body, add: "Triggered by issue #${{ github.event.issue.number }}".
          claude_args: |
            --max-turns 40
            --model claude-opus-4-8
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"

      # --- DOC UPDATES: locate and edit the EXISTING page(s) for the feature. ---
      # No update-specific skill exists, so the behavior is driven here. It reuses
      # the same fetch skills (Jira/Confluence/Google) and snyk-docs-writing-rules,
      # then edits in place instead of creating a page.
      - name: Update existing docs with Claude Code
        id: claude_update
        if: needs.gate.outputs.mode == 'update'
        uses: anthropics/claude-code-action@v1
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.SHIP_IT_PAT }}
          prompt: |
            Update EXISTING Snyk documentation for the change described in Jira
            ticket ${{ needs.gate.outputs.ticket }}. This is a doc-UPDATE, not a
            new page — do not create a new page unless the change genuinely has no
            existing home.

            You are running headlessly in GitHub Actions — there is no human to
            answer prompts. Steps:
            1. Fetch the ticket with:
               python .claude/skills/fetch-jira-ticket/scripts/fetch_jira_ticket.py ${{ needs.gate.outputs.ticket }}
               and fetch any referenced Confluence pages / Google Docs with the
               fetch-confluence and fetch-google-docs scripts under .claude/skills/.
               If a Google token is not configured, skip Google Docs and note it.
            2. Identify which existing page(s) the change affects. Search the
               repository (Grep/Glob over the section folders and each SUMMARY.md)
               for the feature, product area, commands, or UI names in the ticket.
               List the candidate files you found.
            3. Edit the existing page(s) in place to reflect the change. Apply the
               /snyk-docs-writing-rules skill. Keep edits scoped to what the ticket
               describes; do not rewrite unrelated content.
            4. If the ticket clearly describes something with no existing page,
               fall back to creating one per the /ship-it-new-docs placement rules,
               and say so in the PR body.
            5. Commit to a new branch named ship-it/${{ needs.gate.outputs.ticket }},
               push it, then run /create-draft-pr to open a DRAFT PR against main.
            6. The PR title must start with "${{ needs.gate.outputs.ticket }}:".
               In the PR body: list every file changed and why, note this was a
               doc-update run, and add "Triggered by issue #${{ github.event.issue.number }}".
          claude_args: |
            --max-turns 40
            --model claude-opus-4-8
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"

      - name: Report success on the issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            // Find the draft PR that references this issue.
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              head: `${context.repo.owner}:ship-it/${{ needs.gate.outputs.ticket }}`,
            });
            const pr = prs[0];
            const link = pr ? `#${pr.number}` : "the newly opened draft PR";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ Draft ${{ needs.gate.outputs.mode == 'update' && 'doc updates' || 'docs' }} ready in ${link} for **${{ needs.gate.outputs.ticket }}**. A Technical Writer reviews it after it is moved from Draft to Ready.`,
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ["ship-it-processed"],
            });

      - name: Report failure on the issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ The ship-it workflow failed for **${{ needs.gate.outputs.ticket }}**. See the [run log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ["ship-it-failed"],
            });
